name: iOS Xcode Build

on:
  push:
    branches: [ "main" ] # main branch'ine kod pushlandığında çalışır

jobs:
  build:
    # GitHub'ın macOS bulut sunucusunu çağırıyoruz
    runs-on: macos-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Xcode sürümünü göster
      run: |
        xcode-select -p
        xcodebuild -version

    - name: CocoaPods bağımlılıklarını kur
      working-directory: ios/App
      run: pod install

    - name: Xcode ile projeyi derle
      working-directory: ios/App
      run: |
        xcodebuild -workspace "App.xcworkspace" \
                   -scheme "App" \
                   -configuration Release \
                   -sdk iphoneos \
                   clean build
