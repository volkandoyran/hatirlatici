name: iOS Xcode Build

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript bağımlılıklarını kur
        run: npm install

      - name: iOS kaynaklarını derle ve eşitle
        run: npm run ios:sync

      - name: Xcode ve CocoaPods sürümlerini göster
        run: |
          xcode-select -p
          xcodebuild -version
          pod --version

      - name: CocoaPods bağımlılıklarını kur
        working-directory: ios/App
        run: pod install

      - name: Cihaz için imzasız derle (iphoneos)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace "App.xcworkspace" \
                     -scheme "App" \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build/device \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Simülatör için derle (iphonesimulator)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace "App.xcworkspace" \
                     -scheme "App" \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath build/simulator \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Derlenen uygulamaları paketle
        working-directory: ios/App
        run: |
          mkdir -p ../../ciktilar/Payload
          cp -R build/device/Build/Products/Release-iphoneos/App.app ../../ciktilar/Payload/
          (cd ../../ciktilar && zip -qry Hatirlaticilarim-imzasiz.ipa Payload && rm -rf Payload)
          (cd build/simulator/Build/Products/Debug-iphonesimulator && zip -qry ../../../../../../../ciktilar/Hatirlaticilarim-simulator.app.zip App.app)
          ls -la ../../ciktilar

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: hatirlaticilarim-ios-${{ github.run_number }}
          path: ciktilar/
          retention-days: 14
