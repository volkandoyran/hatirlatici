name: iOS Xcode Build

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS derlemesi - ${{ matrix.ad }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kimlik: hatirlatici
            ad: Hatirlaticilarim
            dizin: .
            widget: true
            test: false
            yetki: App/App.entitlements
          - kimlik: ceviri
            ad: Cevirilerim
            dizin: ceviri
            widget: false
            test: true
            yetki: ""
    defaults:
      run:
        working-directory: ${{ matrix.dizin }}

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: JavaScript bağımlılıklarını kur
        run: npm install

      - name: Birim testleri
        if: matrix.test
        run: npm test

      - name: iOS kaynaklarını derle ve eşitle
        run: npm run ios:sync

      - name: Xcode ve CocoaPods sürümlerini göster
        run: |
          xcode-select -p
          xcodebuild -version
          pod --version

      - name: CocoaPods bağımlılıklarını kur
        working-directory: ${{ matrix.dizin }}/ios/App
        run: pod install

      - name: Cihaz için imzasız derle (iphoneos)
        working-directory: ${{ matrix.dizin }}/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace "App.xcworkspace" \
                     -scheme "App" \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build/device \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Simülatör için derle (iphonesimulator)
        working-directory: ${{ matrix.dizin }}/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace "App.xcworkspace" \
                     -scheme "App" \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath build/simulator \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Widget uzantısının pakete gömüldüğünü doğrula
        if: matrix.widget
        working-directory: ${{ matrix.dizin }}/ios/App
        run: |
          for app in build/device/Build/Products/Release-iphoneos/App.app \
                     build/simulator/Build/Products/Debug-iphonesimulator/App.app; do
            test -f "$app/PlugIns/HatirlaticilarimWidgetExtension.appex/Info.plist" \
              || { echo "::error::Widget uzantısı $app içinde yok"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" \
            build/device/Build/Products/Release-iphoneos/App.app/PlugIns/HatirlaticilarimWidgetExtension.appex/Info.plist

      - name: Yetkileri gömmek için ad-hoc imzala
        # Sideloadly/AltStore uygulamayı kendi Apple ID'nle yeniden imzalarken mevcut
        # yetkileri (App Group) korur; imzasız pakette bu bilgi olmadığı için widget
        # uygulama verisini okuyamazdı.
        working-directory: ${{ matrix.dizin }}/ios/App
        env:
          APP_YETKI: ${{ matrix.yetki }}
        run: |
          APP=build/device/Build/Products/Release-iphoneos/App.app
          for fw in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do
            [ -e "$fw" ] && codesign --force --sign - --timestamp=none "$fw"
          done
          for appex in "$APP"/PlugIns/*.appex; do
            [ -e "$appex" ] || continue
            ad=$(basename "$appex" .appex); ad=${ad%Extension}
            codesign --force --sign - --timestamp=none --entitlements "$ad/$ad.entitlements" "$appex"
          done
          if [ -n "$APP_YETKI" ]; then
            codesign --force --sign - --timestamp=none --entitlements "$APP_YETKI" "$APP"
          else
            codesign --force --sign - --timestamp=none "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          for b in "$APP" "$APP"/PlugIns/*.appex; do
            [ -e "$b" ] || continue
            echo "== $b"; codesign -d --entitlements - "$b" 2>/dev/null || true
          done
          if [ -n "$APP_YETKI" ]; then
            codesign -d --entitlements - "$APP" 2>/dev/null | grep -q "group.com.hatirlaticilarim.app" \
              || { echo "::error::App Group yetkisi pakete gömülmedi"; exit 1; }
          fi

      - name: Derlenen uygulamaları paketle
        working-directory: ${{ matrix.dizin }}/ios/App
        run: |
          CIKTI="$GITHUB_WORKSPACE/ciktilar"
          mkdir -p "$CIKTI/Payload"
          cp -R build/device/Build/Products/Release-iphoneos/App.app "$CIKTI/Payload/"
          (cd "$CIKTI" && zip -qry ${{ matrix.ad }}.ipa Payload && rm -rf Payload)
          (cd build/simulator/Build/Products/Debug-iphonesimulator && zip -qry "$CIKTI/${{ matrix.ad }}-simulator.app.zip" App.app)
          ls -la "$CIKTI"

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.kimlik }}-ios-${{ github.run_number }}
          path: ciktilar/
          retention-days: 14
